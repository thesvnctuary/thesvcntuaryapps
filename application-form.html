<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Discord Staff Application</title>\n</head>\n<body>\n    <h1>Discord Staff Application Form</h1>\n    <form id="applicationForm">\n        <label for="name">1. What is your name?</label><br>\n        <input type="text" id="name" name="name" required><br><br>\n\n        <label for="age">2. What is your age?</label><br>\n        <input type="number" id="age" name="age" required><br><br>\n\n        <label for="experience">3. What experience do you have with moderation?</label><br>\n        <input type="text" id="experience" name="experience" required><br><br>\n\n        <label for="availability">4. How many hours can you dedicate to moderation per week?</label><br>\n        <input type="text" id="availability" name="availability" required><br><br>\n\n        <label>5. Why do you want to be a staff member?</label><br>\n        <textarea id="reason" name="reason" rows="4" required></textarea><br><br>\n\n        <label>6. Situational Questions:</label><br>\n        <label for="situation1">Situation 1: You see a member breaking the rules. What do you do?</label><br>\n        <input type="text" id="situation1" name="situation1" required><br><br>\n        <label for="situation2">Situation 2: A user is upset and is causing drama. How do you handle it?</label><br>\n        <input type="text" id="situation2" name="situation2" required><br><br>\n        <label for="situation3">Situation 3: A new member is asking questions in the wrong channel. How do you assist them?</label><br>\n        <input type="text" id="situation3" name="situation3" required><br><br>\n        <label for="situation4">Situation 4: You overhear a staff member being disrespectful. What are your actions?</label><br>\n        <input type="text" id="situation4" name="situation4" required><br><br>\n        <label for="situation5">Situation 5: A member is consistently spamming. What steps do you take?</label><br>\n        <input type="text" id="situation5" name="situation5" required><br><br>\n        <label for="situation6">Situation 6: A user is sharing inappropriate content. What is your response?</label><br>\n        <input type="text" id="situation6" name="situation6" required><br><br>\n        <label for="situation7">Situation 7: How would you handle a conflict between two members?</label><br>\n        <input type="text" id="situation7" name="situation7" required><br><br>\n        <label for="situation8">Situation 8: A user requests a feature that you believe is not beneficial. How do you respond?</label><br>\n        <input type="text" id="situation8" name="situation8" required><br><br>\n\n        <button type="submit">Submit</button>\n    </form>\n    <script>\n        document.getElementById('applicationForm').onsubmit = function(event) {\n            event.preventDefault();\n            const formData = new FormData(this);\n            const formEntries = Object.fromEntries(formData);\n            localStorage.setItem('staffApplication', JSON.stringify(formEntries));\n            alert('Your application has been saved!');\n        };\n    <\/script>\n</body>\n</html>
